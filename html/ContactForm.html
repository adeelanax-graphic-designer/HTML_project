<!DOCTYPE html>
<html>
<head>
<title>Contact Form</title>
<style>
  body { font-family: Arial; background:#eee; display:flex; justify-content:center;
         align-items:center; height:100vh; }
  .box { background:white; width:350px; padding:20px; border-radius:10px; }
  input, textarea {
    width:100%; padding:10px; margin:10px 0; border-radius:5px; border:1px solid #ddd;
  }
  button { width:100%; padding:10px; background:#333; color:white;
           border:none; border-radius:5px; }
</style>
</head>

<body>
<div class="box">
  <h2>Contact Us</h2>
  <input type="text" placeholder="Name">
  <input type="email" placeholder="Email">
  <textarea rows="4" placeholder="Message"></textarea>
  <button>Send</button>
</div>
</body>
</html>
