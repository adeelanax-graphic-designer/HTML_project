<!DOCTYPE html>
<html>
<head>
<title>Login Page</title>
<style>
  body { background:#e0e0e0; display:flex; justify-content:center;
         align-items:center; height:100vh; font-family:Arial; }
  .box { background:white; width:300px; padding:20px; border-radius:10px;
         box-shadow:0 0 10px rgba(0,0,0,0.2); }
  input { width:100%; padding:10px; margin:10px 0; border-radius:5px;
          border:1px solid #ccc; }
  button { width:100%; padding:10px; background:#333; color:white; border:none; border-radius:5px; }
</style>
</head>

<body>
<div class=\"box\">
  <h2>Login</h2>
  <input type=\"text\" placeholder=\"Username\">
  <input type=\"password\" placeholder=\"Password\">
  <button>Login</button>
</div>
</body>
</html>
