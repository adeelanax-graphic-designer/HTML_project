<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amazing Animated Project</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
      background: linear-gradient(135deg, #a14b4b, #283e51);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    h1 {
      color: rgb(255, 255, 255);
      font-size: 50px;
      text-shadow: 0 0 15px rgba(255,255,255,0.5);
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 5px white; }
      to { text-shadow: 0 0 25px white; }
    }

    .floating-box {
      position: absolute;
      width: 200px;
      height: 200px;
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      animation: float 6s infinite ease-in-out;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-40px); }
      100% { transform: translateY(0); }
    }

    .box1 { top: 10%; left: 10%; animation-delay: 0s; }
    .box2 { top: 60%; left: 70%; animation-delay: 1s; }
    .box3 { top: 30%; left: 50%; animation-delay: 2s; }
    .box4 { top: 75%; left: 20%; animation-delay: 3s; }
  </style>
</head>
<body>
  <div class="floating-box box1"></div>
  <div class="floating-box box2"></div>
  <div class="floating-box box3"></div>
  <div class="floating-box box4"></div>

  <h1>Welcome to Something Amazing ✨</h1>
</body>
</html>
