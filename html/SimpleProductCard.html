<!DOCTYPE html>
<html>
<head>
<title>Product Card</title>
<style>
  body { background:#f4f4f4; display:flex; justify-content:center;
         align-items:center; height:100vh; font-family:Arial; }
  .card {
    background:white; width:280px; padding:20px; border-radius:10px;
    text-align:center; box-shadow:0 0 10px rgba(173, 114, 169, 0.753);
  }
  img { width:100%; border-radius:10px; }
  button {
    margin-top:10px; padding:10px; width:100%; background:#333; color:white;
    border:none; border-radius:5px;
  }
</style>
</head>

<body>
<div class="card">
  <img src=\"https://via.placeholder.com/250\" />
  <h3>Product Title</h3>
  <h4>Fragrance Perfum</h4>
  <p><RS:150></RS:150></p>
  <button>Pay Now</button>
</div>
</body>
</html>
